<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autodiagnostic — Etude incendie</title>
<style>body{font-family:'Segoe UI',sans-serif;background:#111;color:#eee;padding:1.5rem;max-width:800px;margin:auto}h1{color:#4caf50}td{padding:.5rem;border-bottom:1px solid #333;font-size:.85rem}.ok{color:#4caf50;font-weight:700}.ko{color:#ff5252;font-weight:700}.warn{color:#ffb300;font-weight:700}#verdict{margin:1rem 0;padding:1rem;border-radius:8px;font-weight:700}button{padding:.8rem 1.5rem;background:#4caf50;border:none;border-radius:8px;font-weight:700;cursor:pointer}pre{background:#222;padding:1rem;border-radius:8px;overflow:auto;font-size:.75rem}</style></head><body>
<h1>🩺 Autodiagnostic final (projet consolidé)</h1><button onclick="run()">▶ LANCER</button><div id="verdict"></div><div id="out"></div><pre id="report"></pre>
<script>
const JS=['js/data.js','js/engine.js','js/app.js'];
const CORE=['index.html','manifest.json','service-worker.js','css/styles.css'].concat(JS,['images/icon.svg','data/recalls-feed.json','tools/fetch-recalls.mjs','.github/workflows/monthly-recalls.yml']);
const SECRET_RE=/Kevin\s?\d{4,6}/i;
let LOG=[];const line=(ok,t)=>{LOG.push((ok==='OK'?'[OK] ':'[KO] ')+t);return `<tr><td class="${ok==='OK'?'ok':ok==='WARN'?'warn':'ko'}">${ok}</td><td>${t}</td></tr>`;};
const st=async u=>{try{const r=await fetch(u,{cache:'no-store'});return r.ok?200:r.status;}catch{return 'ERR';}};
function h32(s){let h=5381;for(let i=0;i<s.length;i++){h=(Math.imul(h,33)+s.charCodeAt(i))|0;}return h>>>0;}
async function run(){LOG=[];let rows='',ko=0;
for(const f of CORE){const s=await st(f);if(s!==200)ko++;rows+=line(s===200?'OK':'KO',f+' → HTTP '+s);}
for(const f of JS){const src=await fetch(f,{cache:'no-store'}).then(r=>r.text()).catch(()=>'');
 try{new Function(src);rows+=line('OK','SYNTAXE '+f);}catch(e){ko++;rows+=line('KO','SYNTAXE '+f+' : '+e.message);}
 if(SECRET_RE.test(src)){ko++;rows+=line('KO','⚠️ CLAIR SUSPECT dans '+f);}}
const data=await fetch('js/data.js',{cache:'no-store'}).then(r=>r.text()).catch(()=>'');
rows+=line(data.includes('FIRE_ORIGIN')&&data.includes('VEHICLE_CATALOG')&&data.includes('verifyAttribution')?'OK':'KO','data.js : foyer + catalogue + attribution');
rows+=line((data.match(/R\(\[/g)||[]).length>300?'OK':'WARN','Entrées base = '+((data.match(/R\(\[/g)||[]).length)+' + feed');
const eng=await fetch('js/engine.js',{cache:'no-store'}).then(r=>r.text()).catch(()=>'');
rows+=line(eng.includes('unifiedSearch')&&eng.includes('acAdminLogin')&&eng.includes('syncRecallsFeed')&&eng.includes('apkShareMail')?'OK':'KO','engine.js : recherches + accès + MAJ + partage');
rows+=line(h32('Kevin83600')===3615734019&&eng.includes('ADMIN_HASH:3615734019')?'OK':'KO','Hash admin cohérent, aucun clair');
const ap=await fetch('js/app.js',{cache:'no-store'}).then(r=>r.text()).catch(()=>'');
rows+=line(ap.includes('renderNavResults')&&ap.includes('bgLayer')&&ap.includes('attachAC')&&ap.includes('renderElroqGrid')?'OK':'KO','app.js : filtres immédiats + fond opacité + cascades + Elroq');
const idx=await fetch('index.html',{cache:'no-store'}).then(r=>r.text()).catch(()=>'');
rows+=line(idx.includes('unifiedInput')&&idx.includes('navResults')&&idx.includes('fo-zone')&&idx.includes('adminBgOpacity')&&idx.includes('shareApkBtn')&&!idx.includes('gBrand2')===false?'OK':'KO','index : sections complètes');
rows+=line(!idx.includes('•••')?'OK':'KO','Mdp sans points');
const sw=await fetch('service-worker.js',{cache:'no-store'}).then(r=>r.text()).catch(()=>'');
const cn=(sw.match(/CACHE='([^']+)'/)||[])[1]||'?';
rows+=line(/etude-v/.test(cn)?'OK':'KO','Cache SW : '+cn);
rows+=line(sw.includes('ntfy.sh')&&sw.includes('api.nhtsa.gov')?'OK':'KO','SW network-first API');
const m=await fetch('manifest.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
if(m){rows+=line(m.name==='Etude incendie by Kevin'?'OK':'KO','Manifest = '+m.name);for(const ic of m.icons){const s=await st(ic.src);if(s!==200){ko++;rows+=line('KO','Icône '+ic.src+' → '+s);}}}else{ko++;rows+=line('KO','manifest illisible');}
const fd=await fetch('data/recalls-feed.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
rows+=line(fd?'OK':'KO','Feed v'+(fd?fd.version:'?')+' — '+(fd?fd.cases.length:0)+' cas');
let swr='KO';if(navigator.serviceWorker){const r=await navigator.serviceWorker.getRegistration();swr=r&&r.active?'OK':'KO';}if(swr==='KO')ko++;
rows+=line(swr,'Service Worker actif');
rows+=line('periodicSync' in navigator?'OK':'WARN','Periodic Sync mensuel : '+('periodicSync' in navigator?'oui':'fallback'));
let ntfy='KO';try{const r=await fetch('https://ntfy.sh/health',{cache:'no-store'});ntfy=r.ok?'OK':'KO';}catch(e){ntfy='WARN';}
rows+=line(ntfy,'Canal ntfy.sh (notifications admin/tiers)');
let stest=null;try{stest=JSON.parse(localStorage.getItem('searchTest')||'null');}catch(e){}
if(stest&&stest.r5>0&&stest.elroq>0)rows+=line('OK','TEST recherche : r5='+stest.r5+' | w206='+stest.w206+' | elroq='+stest.elroq);
else rows+=line('WARN','TEST recherche : ouvrez l\'app d\'abord');
let ct=null;try{ct=JSON.parse(localStorage.getItem('cascadeTest')||'null');}catch(e){}
if(ct&&ct.res&&ct.res.every(n=>n>0))rows+=line('OK','TEST cascades = '+ct.res.join(','));
else rows+=line('WARN','TEST cascades : ouvrez l\'app d\'abord');
let bad=0,tot=0;if(navigator.onLine){const P=data;for(const u of (P.match(/https:\/\/image[^"]+/g)||[]).slice(0,60)){tot++;try{await fetch(u,{mode:'no-cors',cache:'no-store'});}catch{bad++;}}}
rows+=line(bad===0?'OK':'WARN','Photos réelles : '+(tot-bad)+'/'+tot);
document.getElementById('out').innerHTML='<table>'+rows+'</table>';
const v=document.getElementById('verdict');
if(ko===0){v.style.background='#1b5e20';v.textContent='✅ PROJET CONSOLIDÉ CONFORME — prêt pour GitHub Pages + PWABuilder.';}else{v.style.background='#b71c1c';v.textContent='❌ '+ko+' anomalie(s) — corrigez les KO.';}
document.getElementById('report').textContent=LOG.join('\n');}
</script></body></html>
